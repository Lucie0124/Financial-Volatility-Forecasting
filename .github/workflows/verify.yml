name: Verify research pipeline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      OMP_NUM_THREADS: '4'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Create isolated environment
        shell: python
        run: |
          import os
          from pathlib import Path
          import venv

          root = Path('.venv').resolve()
          venv.create(root, with_pip=True)
          executable_dir = root / ('Scripts' if os.name == 'nt' else 'bin')
          with open(os.environ['GITHUB_PATH'], 'a', encoding='utf-8') as path_file:
              path_file.write(str(executable_dir) + '\n')
      - name: Install reference environment
        run: python -m pip install -e ".[dev]" -c requirements-lock.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Test scientific definitions and evaluation
        run: python -m pytest -q
      - name: Check saved experiment fingerprints
        run: python -m market_risk.evaluation.provenance
      - name: Execute notebooks in fresh kernels
        run: python scripts/execute_notebooks.py --output-dir .notebook-check
